services:
  pp-db:
    image: registry.lil.tools/library/postgres:16.6
    volumes:
      - db_data_16:/var/lib/postgresql/data:delegated
    environment:
      - POSTGRES_PASSWORD=example
  web:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    image: registry.lil.tools/harvardlil/perma-payments:23-e9e425062f5a7e179aa151a037eff71a
    tty: true
    command: bash
    environment:
      - DOCKERIZED=true
    volumes:
      - .:/app:delegated
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - pp-db
    networks:
      default:
        aliases:
          - 'perma-payments'

volumes:
  db_data_16:

networks:
  default:
